<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat — iadebarrio</title>
    <link rel="manifest" href="/manifest-chat.json">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4712/4712035.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #16161e;
            --bg-tertiary: #1e1e2a;
            --accent: #6c5ce7;
            --accent-glow: rgba(108, 92, 231, 0.25);
            --text-main: #e8e6f0;
            --text-grey: #8b8a97;
            --card-border: rgba(255,255,255,0.06);
            --bubble-admin: linear-gradient(135deg, #6c5ce7, #a855f7);
            --bubble-lead: #1e1e2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Header --- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--card-border);
            flex-shrink: 0;
        }
        .chat-header .avatar {
            width: 42px; height: 42px;
            border-radius: 50%;
            background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 1.1rem; color: #fff;
            flex-shrink: 0;
        }
        .chat-header .info { flex: 1; min-width: 0; }
        .chat-header .info .name {
            font-weight: 700; font-size: 1rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-header .info .status {
            font-size: 0.72rem; color: var(--text-grey);
            display: flex; align-items: center; gap: 5px;
        }
        .chat-header .info .status .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: #2ecc71; display: inline-block;
        }

        /* --- Messages area --- */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            min-height: 0;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

        .msg-wrapper {
            display: flex; flex-direction: column; gap: 2px;
            max-width: 82%;
        }
        .msg-wrapper.admin { align-self: flex-start; }
        .msg-wrapper.lead { align-self: flex-end; }

        .msg-meta {
            font-size: 0.62rem; color: var(--text-grey);
            padding: 0 6px;
        }
        .msg-wrapper.lead .msg-meta { text-align: right; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.88rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .msg-wrapper.admin .msg-bubble {
            background: var(--bubble-lead);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            border-bottom-left-radius: 4px;
        }
        .msg-wrapper.lead .msg-bubble {
            background: var(--bubble-admin);
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble img {
            max-width: 100%; border-radius: 10px; margin-top: 6px; cursor: pointer;
        }
        .msg-bubble a {
            color: inherit; text-decoration: underline; font-size: 0.8rem;
        }

        /* --- Date separator --- */
        .date-separator {
            text-align: center; font-size: 0.68rem; color: var(--text-grey);
            padding: 12px 0 4px;
        }

        /* --- Empty state --- */
        .empty-state {
            flex: 1; display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 12px; opacity: 0.4;
        }
        .empty-state span { font-size: 2.5rem; }
        .empty-state p { font-size: 0.85rem; color: var(--text-grey); }

        /* --- Input bar --- */
        .chat-input-bar {
            display: flex; align-items: center; gap: 8px;
            padding: 12px 14px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--card-border);
            flex-shrink: 0;
        }
        .chat-input-bar input[type="text"] {
            flex: 1; background: var(--bg-tertiary);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 11px 16px;
            color: var(--text-main);
            font-size: 0.88rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .chat-input-bar input[type="text"]:focus {
            border-color: var(--accent);
        }
        .chat-input-bar input[type="text"]::placeholder { color: var(--text-grey); }

        .chat-input-bar .btn-icon {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .btn-attach, .btn-emoji {
            background: var(--bg-tertiary);
            color: var(--text-grey);
        }
        .btn-attach:hover, .btn-emoji:hover { background: var(--bg-primary); color: var(--text-main); }

        .btn-send {
            background: var(--accent);
            color: #fff;
        }
        .btn-send:hover { filter: brightness(1.15); transform: scale(1.05); }
        .btn-send:active { transform: scale(0.95); }

        /* --- Emoji picker --- */
        .emoji-picker {
            display: none;
            position: absolute;
            bottom: 52px; left: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 100;
            width: 280px;
            max-height: 200px;
            overflow-y: auto;
        }
        .emoji-picker::-webkit-scrollbar { width: 4px; }
        .emoji-picker::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 2px; font-size: 1.2rem; text-align: center;
        }
        .emoji-grid span {
            cursor: pointer; padding: 3px; border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        .emoji-grid span:hover { background: rgba(255,255,255,0.08); }

        /* --- Install modal (Apple style) --- */
        .install-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            max-width: none !important;
            margin: 0 !important;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; padding: 24px;
        }
        .install-modal {
            background: linear-gradient(180deg, #1e1e2a 0%, #16161e 100%);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            max-width: 360px; width: 100%;
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
            animation: modalPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }
        .install-modal-header {
            padding: 28px 24px 16px;
            text-align: center;
        }
        .install-modal-header .modal-icon {
            width: 64px; height: 64px; border-radius: 16px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; margin: 0 auto 16px;
            box-shadow: 0 8px 24px rgba(108,92,231,0.3);
        }
        .install-modal-header h3 { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
        .install-modal-header p { font-size: 0.8rem; color: var(--text-grey); margin-top: 6px; line-height: 1.4; }
        .install-steps {
            padding: 0 20px 20px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .install-step {
            display: flex; align-items: flex-start; gap: 14px;
            padding: 14px; border-radius: 14px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            transition: background 0.2s;
        }
        .install-step:hover { background: rgba(255,255,255,0.07); }
        .install-step .step-num {
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--accent); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(108,92,231,0.3);
        }
        .install-step .step-text {
            font-size: 0.82rem; line-height: 1.5; color: var(--text-main);
        }
        .install-step .step-text strong { color: #fff; font-weight: 700; }
        .install-modal-close {
            display: block; width: calc(100% - 40px); margin: 0 20px 20px;
            padding: 14px; border-radius: 14px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
            color: var(--text-main); font-size: 0.88rem; font-weight: 700;
            cursor: pointer; font-family: inherit; text-align: center;
            transition: all 0.2s;
        }
        .install-modal-close:hover { background: var(--accent); border-color: var(--accent); }

        /* --- Header install btn --- */
        .header-install-btn {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 20px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            border: none; color: #fff;
            font-size: 0.72rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            flex-shrink: 0; font-family: inherit;
            box-shadow: 0 2px 12px rgba(108,92,231,0.3);
            animation: installPulse 2.5s ease-in-out infinite;
        }
        .header-install-btn:hover { filter: brightness(1.15); transform: scale(1.03); }
        .header-install-btn .install-icon { font-size: 0.9rem; }
        @keyframes installPulse {
            0%, 100% { box-shadow: 0 2px 12px rgba(108,92,231,0.3); }
            50% { box-shadow: 0 2px 20px rgba(108,92,231,0.6); }
        }

        /* --- Loading screen --- */
        .loading-screen {
            position: fixed; inset: 0;
            background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; z-index: 999;
        }
        .loading-screen .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--card-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-screen p { font-size: 0.85rem; color: var(--text-grey); }

        /* --- Error screen --- */
        .error-screen {
            position: fixed; inset: 0;
            background: var(--bg-primary);
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; gap: 16px; z-index: 999;
        }
        .error-screen span { font-size: 3rem; }
        .error-screen h2 { font-size: 1.2rem; font-weight: 700; }
        .error-screen p { font-size: 0.85rem; color: var(--text-grey); max-width: 300px; text-align: center; line-height: 1.5; }

        /* --- PWA install banner (Apple style) --- */
        .pwa-banner {
            display: none;
            padding: 14px 18px;
            background: rgba(22, 22, 30, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            align-items: center; gap: 14px;
            flex-shrink: 0;
        }
        .pwa-banner .pwa-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a855f7);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; flex-shrink: 0;
        }
        .pwa-banner .pwa-text { flex: 1; min-width: 0; }
        .pwa-banner .pwa-text .pwa-title {
            font-size: 0.82rem; font-weight: 700; color: var(--text-main);
        }
        .pwa-banner .pwa-text .pwa-subtitle {
            font-size: 0.68rem; color: var(--text-grey); margin-top: 2px;
        }
        .pwa-banner .pwa-btn {
            background: var(--accent);
            color: #fff; border: none;
            padding: 8px 18px; border-radius: 20px;
            font-size: 0.76rem; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
            font-family: inherit; white-space: nowrap;
        }
        .pwa-banner .pwa-btn:hover { filter: brightness(1.15); }
        .pwa-banner .pwa-close {
            background: none; border: none; color: var(--text-grey);
            cursor: pointer; font-size: 1rem; padding: 4px;
            border-radius: 50%; transition: all 0.2s;
        }
        .pwa-banner .pwa-close:hover { background: rgba(255,255,255,0.06); color: var(--text-main); }

        /* --- Responsive --- */
        @media (min-width: 600px) {
            body {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid var(--card-border);
                border-right: 1px solid var(--card-border);
            }
        }
    </style>
</head>
<body>

<!-- Loading -->
<div class="loading-screen" id="loading-screen">
    <div class="spinner"></div>
    <p>Conectando al chat...</p>
</div>

<!-- Error -->
<div class="error-screen" id="error-screen" style="display:none">
    <span>🔒</span>
    <h2>Enlace no válido</h2>
    <p>Este enlace de chat no existe o ha expirado. Contacta con nosotros para obtener un nuevo acceso.</p>
</div>

<!-- Chat App (hidden until loaded) -->
<div id="chat-app" style="display:none;flex-direction:column;height:100dvh">

    <!-- Header -->
    <div class="chat-header">
        <div class="avatar" id="chat-avatar">G</div>
        <div class="info">
            <div class="name">Gerard — iadebarrio</div>
            <div class="status"><span class="dot"></span> En línea</div>
        </div>
        <button class="header-install-btn" id="header-install-btn" onclick="showInstallModal()" title="Instalar app"><span class="install-icon">📲</span> Instalar</button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chat-messages"></div>

    <!-- Input -->
    <div class="chat-input-bar">
        <button class="btn-icon btn-attach" onclick="document.getElementById('file-input').click()" title="Adjuntar archivo">📎</button>
        <input type="file" id="file-input" style="display:none" onchange="handleFileUpload(this)">
        <div style="position:relative;flex-shrink:0">
            <button class="btn-icon btn-emoji" onclick="toggleEmojiPicker()" title="Emojis">😊</button>
            <div class="emoji-picker" id="emoji-picker">
                <div class="emoji-grid" id="emoji-grid"></div>
            </div>
        </div>
        <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off"
            onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="btn-icon btn-send" onclick="sendMessage()" title="Enviar">➤</button>
    </div>
</div>

<script>
// ===== CONFIG =====
const SUPABASE_URL = 'https://lmozoetpehmdxxremtqn.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxtb3pvZXRwZWhtZHh4cmVtdHFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTA2NDUsImV4cCI6MjA5NTgyNjY0NX0.1xkCCw7q9CDvVbqGswCeFwXpgYfMtb0wcl7lHWlKQ8U';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const VAPID_PUBLIC_KEY = 'BAfWR9i2l5IKCTMpV5cjjjTt4dkSQuvGMUAO5aSVIVMEvXWElSTIrf3S92HhmqveaiWhcdXXw5WUaaYL7AxI1Fg';
const API_BASE = 'https://cerebrocomercial-ai.iadebarrio.com/api';

let currentRoom = null;
let subscription = null;
let deferredPrompt = null;

// ===== TOKEN HELPERS =====
function setCookie(name, value, days) {
    const d = new Date();
    d.setTime(d.getTime() + days * 24 * 60 * 60 * 1000);
    document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/;SameSite=Lax`;
}
function getCookie(name) {
    const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
    return match ? match[2] : null;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', init);

async function init() {
    const params = new URLSearchParams(window.location.search);
    // Triple fallback: URL → cookie → localStorage
    let token = params.get('token') || params.get('t');
    
    if (token) {
        // Save token everywhere for PWA reinstalls
        localStorage.setItem('chat_token', token);
        setCookie('chat_token', token, 365); // 1 year
    } else {
        // PWA opened without token — recover from cookie first (iOS), then localStorage
        token = getCookie('chat_token') || localStorage.getItem('chat_token');
    }

    if (!token) return showError();

    try {
        const { data: room, error } = await sb
            .from('chat_rooms')
            .select('*')
            .eq('link_token', token)
            .single();

        if (error || !room) return showError();

        currentRoom = room;
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('chat-app').style.display = 'flex';

        await loadMessages();
        subscribeToMessages();
        registerServiceWorker();
        showInstallBanner();
        clearAppBadge();
    } catch(e) {
        console.error('Init error:', e);
        showError();
    }
}

function showError() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('error-screen').style.display = 'flex';
}

// ===== INSTALL BANNER =====
function showInstallBanner() {
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (isStandalone) {
        // Already installed — hide the button
        const btn = document.getElementById('header-install-btn');
        if (btn) btn.style.display = 'none';
        return;
    }
    
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    if (isIOS) {
        // iOS: show Apple modal with instructions after delay
        setTimeout(() => showInstallModal(), 2000);
    }
    // Android/Chrome: handled by beforeinstallprompt event
}

// ===== LOAD MESSAGES =====
async function loadMessages() {
    const container = document.getElementById('chat-messages');
    const { data: messages, error } = await sb
        .from('chat_messages')
        .select('*')
        .eq('room_id', currentRoom.id)
        .order('created_at', { ascending: true });

    if (error || !messages?.length) {
        container.innerHTML = `
            <div class="empty-state">
                <span>👋</span>
                <p>¡Hola! Este es el inicio de tu conversación.</p>
            </div>`;
        return;
    }

    renderMessages(messages);
}

function renderMessages(messages) {
    const container = document.getElementById('chat-messages');
    let lastDate = '';
    let html = '';

    messages.forEach(m => {
        const d = new Date(m.created_at);
        const dateStr = d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long', year: 'numeric' });
        if (dateStr !== lastDate) {
            html += `<div class="date-separator">${dateStr}</div>`;
            lastDate = dateStr;
        }

        const isAdmin = m.sender_type === 'admin';
        const cls = isAdmin ? 'admin' : 'lead';
        const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
        const senderName = m.sender_name || (isAdmin ? 'Gerard' : currentRoom.lead_name || 'Tú');

        let fileHtml = '';
        if (m.file_url) {
            const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(m.file_name || '');
            fileHtml = isImg
                ? `<img src="${m.file_url}" alt="${m.file_name}" onclick="window.open('${m.file_url}','_blank')">`
                : `<a href="${m.file_url}" target="_blank">📄 ${m.file_name || 'Archivo'}</a>`;
        }

        html += `
            <div class="msg-wrapper ${cls}">
                <div class="msg-meta">${senderName} · ${time}</div>
                <div class="msg-bubble">${m.content || ''}${fileHtml}</div>
            </div>`;
    });

    container.innerHTML = html;
    // Scroll to bottom - multiple attempts for images loading
    const scrollBottom = () => container.scrollTop = container.scrollHeight;
    scrollBottom();
    requestAnimationFrame(scrollBottom);
    setTimeout(scrollBottom, 100);
    setTimeout(scrollBottom, 500);
}

// ===== SEND MESSAGE =====
async function sendMessage() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !currentRoom) return;

    input.value = '';
    input.focus();

    try {
        await sb.from('chat_messages').insert({
            room_id: currentRoom.id,
            sender_type: 'lead',
            sender_name: currentRoom.lead_name || 'Lead',
            content: text
        });
        await sb.from('chat_rooms').update({ last_message_at: new Date().toISOString() }).eq('id', currentRoom.id);
        // Auto-cancel pending scheduled messages when lead replies
        cancelPendingScheduled();
    } catch(e) {
        console.error('Send error:', e);
    }
}

// ===== FILE UPLOAD =====
async function handleFileUpload(inputEl) {
    if (!currentRoom || !inputEl.files.length) return;
    const file = inputEl.files[0];
    if (file.size > 10 * 1024 * 1024) { alert('El archivo no puede superar 10MB'); return; }

    try {
        const path = `chat/${currentRoom.id}/${Date.now()}_${file.name}`;
        const { data: upload, error: upErr } = await sb.storage.from('chat-files').upload(path, file);
        if (upErr) throw upErr;

        const { data: urlData } = sb.storage.from('chat-files').getPublicUrl(path);

        await sb.from('chat_messages').insert({
            room_id: currentRoom.id,
            sender_type: 'lead',
            sender_name: currentRoom.lead_name || 'Lead',
            content: '',
            file_url: urlData.publicUrl,
            file_name: file.name
        });
        await sb.from('chat_rooms').update({ last_message_at: new Date().toISOString() }).eq('id', currentRoom.id);
        cancelPendingScheduled();
    } catch(e) {
        console.error('Upload error:', e);
        alert('Error al subir archivo');
    }
    inputEl.value = '';
}

// ===== AUTO-CANCEL SCHEDULED MESSAGES ON LEAD REPLY =====
async function cancelPendingScheduled() {
    if (!currentRoom) return;
    try {
        await sb
            .from('chat_scheduled_messages')
            .update({ status: 'cancelled' })
            .eq('room_id', currentRoom.id)
            .eq('status', 'pending');
        console.log('Pending scheduled messages cancelled for room', currentRoom.id);
    } catch(e) {
        console.error('Error cancelling scheduled:', e);
    }
}

let unreadCount = 0;
let isPageVisible = true;

document.addEventListener('visibilitychange', () => {
    isPageVisible = !document.hidden;
    if (isPageVisible) {
        // Clear badge when user opens the app
        unreadCount = 0;
        updateBadge(0);
    }
});

function updateBadge(count) {
    if ('setAppBadge' in navigator) {
        if (count > 0) {
            navigator.setAppBadge(count).catch(() => {});
        } else {
            navigator.clearAppBadge().catch(() => {});
        }
    }
}

function onNewMessageReceived(senderType) {
    // Only badge for admin messages when app is not visible
    if (senderType === 'admin' && !isPageVisible) {
        unreadCount++;
        updateBadge(unreadCount);
    }
}

// ===== REALTIME =====
function subscribeToMessages() {
    subscription = sb
        .channel('lead-chat-' + currentRoom.id)
        .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'chat_messages',
            filter: `room_id=eq.${currentRoom.id}`
        }, payload => {
            const m = payload.new;
            const container = document.getElementById('chat-messages');

            const empty = container.querySelector('.empty-state');
            if (empty) empty.remove();

            const isAdmin = m.sender_type === 'admin';
            const cls = isAdmin ? 'admin' : 'lead';
            const time = new Date(m.created_at).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const senderName = m.sender_name || (isAdmin ? 'Gerard' : currentRoom.lead_name || 'Tú');

            let fileHtml = '';
            if (m.file_url) {
                const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(m.file_name || '');
                fileHtml = isImg
                    ? `<img src="${m.file_url}" alt="${m.file_name}" onclick="window.open('${m.file_url}','_blank')">`
                    : `<a href="${m.file_url}" target="_blank">📄 ${m.file_name || 'Archivo'}</a>`;
            }

            const div = document.createElement('div');
            div.className = `msg-wrapper ${cls}`;
            div.innerHTML = `
                <div class="msg-meta">${senderName} · ${time}</div>
                <div class="msg-bubble">${m.content || ''}${fileHtml}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            
            // PWA Badge: notify unread when app not visible
            onNewMessageReceived(m.sender_type);
        })
        .subscribe();
}

function clearAppBadge() {
    try {
        if (navigator.clearAppBadge) navigator.clearAppBadge();
        // Also clear notifications
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.ready.then(reg => {
                reg.getNotifications().then(notifications => {
                    notifications.forEach(n => n.close());
                });
            });
        }
    } catch(e) {}
}

});

// ===== PWA =====
function registerServiceWorker() {
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/chat-sw.js').then(reg => {
            reg.update();
            // Subscribe to push notifications after SW is ready
            if (currentRoom) {
                subscribeToPush(reg);
            }
        }).catch(e => console.log('SW reg failed:', e));
    }
}

// ===== PUSH NOTIFICATIONS =====
async function subscribeToPush(swReg) {
    if (!('PushManager' in window)) {
        console.log('Push not supported');
        return;
    }
    
    // Check if already subscribed
    const existingSub = await swReg.pushManager.getSubscription();
    if (existingSub) {
        console.log('Already subscribed to push');
        savePushSubscription(existingSub);
        hidePushBell(); // already subscribed
        return;
    }
    
    // If permission already granted, subscribe silently
    if (Notification.permission === 'granted') {
        await doSubscribe(swReg);
        return;
    }
    
    // Otherwise, show the bell button to request permission via user gesture
    if (Notification.permission !== 'denied') {
        showPushBell();
    }
}

// Called when user taps the bell
async function requestPushPermission() {
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
        console.log('Notification permission denied');
        hidePushBell();
        return;
    }
    
    // Subscribe after permission granted
    const reg = await navigator.serviceWorker.ready;
    await doSubscribe(reg);
    hidePushBell();
}

async function doSubscribe(swReg) {
    try {
        const pushSub = await swReg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
        console.log('Push subscribed!', pushSub);
        savePushSubscription(pushSub);
    } catch (e) {
        console.error('Push subscribe error:', e);
    }
}

function showPushBell() {
    // Inject notification bell bar at top of chat
    if (document.getElementById('push-bell-bar')) return;
    const bar = document.createElement('div');
    bar.id = 'push-bell-bar';
    bar.style.cssText = 'display:flex;align-items:center;gap:10px;padding:10px 16px;background:linear-gradient(135deg,rgba(108,92,231,0.15),rgba(168,85,247,0.1));border-bottom:1px solid rgba(108,92,231,0.2);cursor:pointer;';
    bar.innerHTML = `
        <span style="font-size:1.3rem">🔔</span>
        <div style="flex:1">
            <div style="font-size:0.8rem;font-weight:700;color:var(--text-main)">Activar notificaciones</div>
            <div style="font-size:0.68rem;color:var(--text-grey)">Recibe avisos cuando te envíen un mensaje</div>
        </div>
        <button onclick="event.stopPropagation();requestPushPermission()" style="padding:6px 14px;border-radius:16px;background:linear-gradient(135deg,#6c5ce7,#a855f7);border:none;color:#fff;font-size:0.72rem;font-weight:700;cursor:pointer;font-family:inherit">Activar</button>
        <button onclick="event.stopPropagation();hidePushBell()" style="background:none;border:none;color:var(--text-grey);font-size:1rem;cursor:pointer;padding:4px">✕</button>
    `;
    bar.onclick = () => requestPushPermission();
    const chatApp = document.getElementById('chat-app');
    const messages = document.getElementById('chat-messages');
    chatApp.insertBefore(bar, messages);
}

function hidePushBell() {
    const bell = document.getElementById('push-bell-bar');
    if (bell) bell.remove();
}

function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
}

async function savePushSubscription(pushSub) {
    if (!currentRoom) return;
    try {
        await fetch(`${API_BASE}/push`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                action: 'subscribe',
                room_id: currentRoom.id,
                subscription: pushSub.toJSON()
            })
        });
        console.log('Push subscription saved for room', currentRoom.id);
    } catch (e) {
        console.error('Error saving push subscription:', e);
    }
}

// Android/Chrome install prompt → show Apple modal
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Auto-show Apple modal after a short delay
    setTimeout(() => showInstallModal(), 1500);
});

// ===== INSTALL MODAL (Apple style) =====
function showInstallModal() {
    // Detect platform
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua);
    const isAndroid = /Android/.test(ua);
    const isMac = /Macintosh|Mac OS/.test(ua) && !isIOS;
    const isWindows = /Windows/.test(ua);
    
    let platformName = 'tu dispositivo';
    let platformIcon = '📲';
    let steps = [];
    
    if (isIOS) {
        platformName = 'iPhone / iPad';
        platformIcon = '🍎';
        steps = [
            { num: '1', text: 'Pulsa el botón <strong>⬆️ Compartir</strong> en la barra inferior de Safari' },
            { num: '2', text: 'Desliza hacia abajo y toca <strong>"Añadir a pantalla de inicio"</strong>' },
            { num: '3', text: 'Pulsa <strong>"Añadir"</strong> en la esquina superior derecha' }
        ];
    } else if (isAndroid) {
        platformName = 'Android';
        platformIcon = '🤖';
        steps = [
            { num: '1', text: 'Pulsa el botón <strong>⋮ Menú</strong> (tres puntos) arriba a la derecha' },
            { num: '2', text: 'Selecciona <strong>"Instalar aplicación"</strong> o <strong>"Añadir a pantalla de inicio"</strong>' },
            { num: '3', text: 'Confirma pulsando <strong>"Instalar"</strong>' }
        ];
    } else if (isMac) {
        platformName = 'Mac';
        platformIcon = '💻';
        steps = [
            { num: '1', text: 'Haz clic en <strong>"Abrir en aplicación"</strong> en la barra de direcciones (arriba a la derecha)' },
            { num: '2', text: 'Si no aparece: <strong>⋮ Menú → Enviar, guardar y compartir → Crear acceso directo</strong>' },
            { num: '3', text: 'En <strong>Safari</strong>: Ve a <strong>Archivo → Añadir al Dock</strong>' }
        ];
    } else if (isWindows) {
        platformName = 'Windows';
        platformIcon = '🪟';
        steps = [
            { num: '1', text: 'En <strong>Chrome/Edge</strong>: Haz clic en el icono <strong>⬇️ instalar</strong> en la barra de direcciones' },
            { num: '2', text: 'También puedes ir a <strong>⋮ Menú → Instalar Chat</strong>' },
            { num: '3', text: 'Confirma haciendo clic en <strong>"Instalar"</strong>' }
        ];
    } else {
        steps = [
            { num: '1', text: 'Abre esta página en <strong>Chrome</strong> o <strong>Edge</strong>' },
            { num: '2', text: 'Busca el icono de <strong>instalar</strong> en la barra de direcciones' },
            { num: '3', text: 'Pulsa <strong>"Instalar"</strong> para añadirlo como app' }
        ];
    }
    
    // If we have the native prompt, offer direct install
    const directInstallBtn = deferredPrompt 
        ? `<button onclick="directPWAInstall()" style="display:block;width:calc(100% - 40px);margin:0 20px 10px;padding:14px;border-radius:14px;background:linear-gradient(135deg,#6c5ce7,#a855f7);border:none;color:#fff;font-size:0.88rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s;box-shadow:0 4px 16px rgba(108,92,231,0.35)">⚡ Instalar directamente</button>`
        : '';
    
    const modal = document.createElement('div');
    modal.className = 'install-modal-overlay';
    modal.id = 'install-modal';
    modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    modal.innerHTML = `
        <div class="install-modal">
            <div class="install-modal-header">
                <div class="modal-icon">${platformIcon}</div>
                <h3>Instalar Chat en ${platformName}</h3>
                <p>Accede al chat al instante desde tu pantalla de inicio</p>
            </div>
            <div class="install-steps">
                ${steps.map(s => `
                    <div class="install-step">
                        <div class="step-num">${s.num}</div>
                        <div class="step-text">${s.text}</div>
                    </div>
                `).join('')}
            </div>
            ${directInstallBtn}
            <button class="install-modal-close" onclick="document.getElementById('install-modal').remove()">Entendido</button>
        </div>
    `;
    document.body.appendChild(modal);
}

function directPWAInstall() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        document.getElementById('install-modal')?.remove();
        document.getElementById('pwa-banner').style.display = 'none';
    });
}
